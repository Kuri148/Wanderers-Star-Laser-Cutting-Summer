<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSCAD Wallpaper Pattern Editor</title>
<style>
  :root {
    --bg: #1e2229;
    --panel: #272c35;
    --panel-light: #313845;
    --accent: #f9a825;
    --accent-dim: #c17e00;
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --grid: #3a414d;
    --axis: #5a6473;
    --line: #4fc3f7;
    --point: #f9a825;
    --closed: #66bb6a;
    --bezier: #ba68c8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 12px 20px;
    flex: 0 0 auto;
    position: relative;
    z-index: 60;
    background: var(--panel);
    border-bottom: 1px solid var(--grid);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  select {
    background: var(--panel-light);
    color: var(--text);
    border: 1px solid var(--grid);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  select:hover { background: var(--grid); }
  #groupSelect {
    font-weight: 600;
    border-color: var(--accent-dim);
  }
  button {
    background: var(--panel-light);
    color: var(--text);
    border: 1px solid var(--grid);
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  button:hover { background: var(--grid); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-dim); }
  button.danger:hover { background: #b3493f; border-color: #b3493f; }
  .toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--panel-light);
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--grid);
    cursor: pointer;
    user-select: none;
    font-size: 13px;
  }
  .toggle input { cursor: pointer; accent-color: var(--bezier); }
  .mode-switch {
    display: inline-flex;
    border: 1px solid var(--grid);
    border-radius: 6px;
    overflow: hidden;
  }
  .mode-switch .mode {
    border: none;
    border-radius: 0;
    background: var(--panel-light);
    padding: 7px 14px;
  }
  .mode-switch .mode + .mode { border-left: 1px solid var(--grid); }
  .mode-switch .mode.active {
    background: var(--accent);
    color: #1a1a1a;
    font-weight: 600;
  }
  main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    position: relative;
    z-index: 1;
  }
  .canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-width: 0;
    position: relative;
  }
  #canvas {
    background: var(--panel);
    border-radius: 8px;
    cursor: crosshair;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    touch-action: none;
  }
  .preview-panel {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 400px;
    background: rgba(30,34,41,0.92);
    border: 1px solid var(--grid);
    border-radius: 8px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    overflow: hidden;
    backdrop-filter: blur(2px);
  }
  .preview-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    border-bottom: 1px solid var(--grid);
  }
  .preview-head button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    padding: 0 4px;
    cursor: pointer;
  }
  .preview-head button:hover { color: var(--text); background: transparent; }
  #previewCanvas {
    display: block;
    width: 400px;
    height: 400px;
    background: #16181d;
  }
  .preview-foot {
    padding: 5px 10px;
    font-size: 10.5px;
    color: var(--text-dim);
    border-top: 1px solid var(--grid);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .preview-panel.collapsed #previewCanvas,
  .preview-panel.collapsed .preview-foot { display: none; }
  .coord-readout {
    position: absolute;
    top: 24px;
    left: 24px;
    background: rgba(0,0,0,0.55);
    padding: 4px 10px;
    border-radius: 5px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--text-dim);
    pointer-events: none;
  }
  .point-editor {
    position: absolute;
    display: none;
    gap: 6px;
    align-items: center;
    background: rgba(20,22,27,0.96);
    border: 1px solid var(--accent-dim);
    border-radius: 6px;
    padding: 6px 8px;
    z-index: 55;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
  }
  .point-editor label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .point-editor input {
    width: 72px;
    background: var(--panel-light);
    border: 1px solid var(--grid);
    color: var(--text);
    border-radius: 4px;
    padding: 3px 5px;
    font-size: 12px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .point-editor input:focus {
    outline: 1px solid var(--accent);
  }
  .sidebar {
    width: 400px;
    background: var(--panel);
    border-left: 1px solid var(--grid);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--grid);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .sidebar-head .out-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .sidebar-head h2 {
    font-size: 14px;
    margin: 0;
    font-weight: 600;
  }
  textarea {
    flex: 1;
    background: #1a1d23;
    color: #d4d4d4;
    border: none;
    padding: 14px 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    resize: none;
    outline: none;
    white-space: pre;
    overflow: auto;
  }
  .status {
    padding: 9px 16px;
    font-size: 12px;
    color: var(--text-dim);
    border-top: 1px solid var(--grid);
    background: var(--panel-light);
  }
  .points-input {
    flex: 0 0 auto;
    border-top: 1px solid var(--grid);
    background: var(--panel-light);
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .points-input-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
  }
  #pointsInput {
    flex: 0 0 auto;
    height: 84px;
    background: #1a1d23;
    color: #d4d4d4;
    border: 1px solid var(--grid);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    white-space: pre;
  }
  #pointsInput:focus { border-color: var(--accent); }
  .points-input .hint {
    font-size: 11px;
    color: var(--text-dim);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .status b { color: var(--accent); }
  .seg-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .seg-control input {
    width: 50px;
    background: var(--panel-light);
    border: 1px solid var(--grid);
    color: var(--text);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
  }
  .copied {
    color: var(--closed) !important;
    font-weight: 600;
  }
  kbd {
    background: var(--panel-light);
    border: 1px solid var(--grid);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: 11px;
  }
</style>
</head>
<body>
<header>
  <h1>⬡ OpenSCAD Wallpaper Pattern Editor</h1>
  <div class="controls">
    <select id="groupSelect" title="Wallpaper group -- domain shape and symmetry come from that group's Template.scad"></select>
    <div class="mode-switch" role="group" aria-label="Tool mode">
      <button id="drawModeBtn" class="mode active">✏️ Draw</button>
      <button id="circleModeBtn" class="mode">⭕ Circle</button>
      <button id="editModeBtn" class="mode">✋ Edit points</button>
    </div>
    <label class="toggle">
      <input type="checkbox" id="bezierToggle">
      Bézier curve tool
    </label>
    <label class="toggle" title="Snap points to the domain corners and to points you've already placed">
      <input type="checkbox" id="snapToggle" checked>
      Snap to points &amp; corners
    </label>
    <label class="toggle" title="While placing or dragging a point, snap it onto the same horizontal/vertical line as another point (a dashed guide line shows the alignment)">
      <input type="checkbox" id="alignToggle" checked>
      Align to points (H/V)
    </label>
    <div class="seg-control" title="Number of straight segments used to approximate each Bézier curve">
      curve segments
      <input type="number" id="segCount" value="12" min="2" max="64">
    </div>
    <div class="seg-control" title="Uniform scale applied to the pattern inside the golden-triangle frame (Full panel output only)">
      pattern scale
      <input type="number" id="scaleInput" value="30" min="0.1" step="0.5">
    </div>
    <button id="undoBtn">Undo point</button>
    <button id="closeBtn">Close loop</button>
    <button id="newBtn">New polygon</button>
    <button id="clearBtn" class="danger">Clear all</button>
  </div>
</header>
<main>
  <div class="canvas-wrap">
    <canvas id="canvas" width="640" height="640"></canvas>
    <div class="coord-readout" id="readout">( –, – )</div>
    <div class="point-editor" id="pointEditor">
      <label><span id="peXLabel">X</span><input type="number" id="peX" step="any"></label>
      <label id="peYWrap"><span>Y</span><input type="number" id="peY" step="any"></label>
    </div>
    <div class="preview-panel" id="previewPanel">
      <div class="preview-head">
        <span>Tiling preview</span>
        <button id="previewToggle" title="Show / hide preview">–</button>
      </div>
      <canvas id="previewCanvas" width="260" height="260"></canvas>
      <div class="preview-foot" id="previewFoot">cut → tile</div>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-head">
      <h2>OpenSCAD output</h2>
      <div class="out-controls">
        <div class="mode-switch" role="group" aria-label="Output mode">
          <button id="outCutBtn" class="mode">Cut shapes</button>
          <button id="outFullBtn" class="mode active">Full panel</button>
        </div>
        <button id="downloadBtn">Download .scad</button>
        <button id="copyBtn" class="primary">Copy</button>
      </div>
    </div>
    <textarea id="output" readonly spellcheck="false"></textarea>
    <div class="points-input">
      <div class="points-input-head">
        <span>Polygon points</span>
        <button id="drawPointsBtn" class="primary">Draw</button>
      </div>
      <textarea id="pointsInput" spellcheck="false" placeholder="[0, 0], [1, 0], [0.5, 1]"></textarea>
      <div class="hint">Paste [x, y] pairs or one "x y" per line, then press Draw.</div>
    </div>
    <div class="status" id="status">Click inside the domain to place your first point.</div>
  </div>
</main>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const output = document.getElementById("output");
  const status = document.getElementById("status");
  const readout = document.getElementById("readout");
  const bezierToggle = document.getElementById("bezierToggle");
  const snapToggle = document.getElementById("snapToggle");
  const alignToggle = document.getElementById("alignToggle");
  const segInput = document.getElementById("segCount");
  const scaleInput = document.getElementById("scaleInput");
  const drawModeBtn = document.getElementById("drawModeBtn");
  const circleModeBtn = document.getElementById("circleModeBtn");
  const editModeBtn = document.getElementById("editModeBtn");
  const outCutBtn = document.getElementById("outCutBtn");
  const outFullBtn = document.getElementById("outFullBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const pointsInput = document.getElementById("pointsInput");
  const drawPointsBtn = document.getElementById("drawPointsBtn");
  const previewPanel = document.getElementById("previewPanel");
  const previewCanvas = document.getElementById("previewCanvas");
  const pctx = previewCanvas.getContext("2d");
  const previewToggle = document.getElementById("previewToggle");
  const previewFoot = document.getElementById("previewFoot");
  const groupSelect = document.getElementById("groupSelect");
  const pointEditor = document.getElementById("pointEditor");
  const peX = document.getElementById("peX");
  const peY = document.getElementById("peY");
  const peXLabel = document.getElementById("peXLabel");
  const peYWrap = document.getElementById("peYWrap");
  let previewOpen = true;

  let mode = "draw";              // "draw" | "edit" | "circle"
  let editTarget = null;          // { poly, point, kind: "anchor"|"handle" } or { circle, kind: "circle-center"|"circle-edge" }
  let outputMode = "full";        // "cut" | "full"

  // ==========================================================================
  // Wallpaper-group definitions
  // ==========================================================================
  // Each group mirrors the actual construction in its Templates/*_Template.scad
  // file: `domain` is the exact fundamental-domain polygon a cut gets drawn
  // into (same coordinates as that file's FundamentalDomain()/fundamentalDomain()
  // /afce()/afe()), `instances` are the point-transform functions that compose
  // one repeatable tile (matching CompiledTile()/parallelogram()/bounded_shape()),
  // and `lattice` are the two translation vectors used to tile the plane
  // (matching PatternArray()/tileThePlane()). Because these match the real
  // template files, a polygon drawn here pastes directly into that group's
  // FundamentalCut() / shapesToCut() without needing to rescale or reposition.

  const SQRT3 = Math.sqrt(3);

  function V(x, y) { return { x, y }; }
  function rot(q, deg, pivot) {
    pivot = pivot || V(0, 0);
    const r = deg * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);
    const dx = q.x - pivot.x, dy = q.y - pivot.y;
    return V(pivot.x + dx * cs - dy * sn, pivot.y + dx * sn + dy * cs);
  }
  // Reflect q across the line through the ORIGIN perpendicular to unit
  // normal (nx,ny) -- matches OpenSCAD's mirror([nx,ny,0]).
  function mirrorN(q, nx, ny) {
    const d = q.x * nx + q.y * ny;
    return V(q.x - 2 * d * nx, q.y - 2 * d * ny);
  }
  // Matches the reflect_line(theta, p) helper used in several templates:
  // reflect q across the line through pivot p at angle theta (degrees).
  function reflectLine(q, pivot, thetaDeg) {
    const th = thetaDeg * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
    const dx = q.x - pivot.x, dy = q.y - pivot.y;
    const rx = dx * cs + dy * sn;
    const ry = -dx * sn + dy * cs;
    const bx = rx * cs - (-ry) * sn;
    const by = rx * sn + (-ry) * cs;
    return V(pivot.x + bx, pivot.y + by);
  }

  // --- Dual-purpose transforms -----------------------------------------------
  // Each group's `instances` list doubles as the source for the "Full panel"
  // output's CompiledTile(). A plain closure (like rot()/mirrorN() above) can
  // move a preview point, but can't also emit the equivalent OpenSCAD
  // transform text. T() pairs the two: `.apply` is the point-transform used
  // for the live preview (identical math to before), `.scad` is the matching
  // OpenSCAD snippet that -- wrapped around FundamentalRemains() -- reproduces
  // it. composeT(t1, t2) applies t1 first then t2 (matching q => t2(t1(q))),
  // and reverses that order for the SCAD text since OpenSCAD nests outer
  // transforms last-applied.
  function r5(v) { return (+v.toFixed(5)).toString(); }
  function T(apply, scad) { return { apply, scad }; }
  function idT() { return T(q => q, ""); }
  function rotT(deg, pivot) {
    pivot = pivot || V(0, 0);
    const apply = q => rot(q, deg, pivot);
    const normDeg = ((deg % 360) + 360) % 360;
    let scad;
    if (normDeg === 0) scad = "";
    else if (pivot.x === 0 && pivot.y === 0) scad = `rotate(${r5(deg)})`;
    else scad = `translate([${r5(pivot.x)}, ${r5(pivot.y)}]) rotate(${r5(deg)}) translate([${r5(-pivot.x)}, ${r5(-pivot.y)}])`;
    return T(apply, scad);
  }
  function mirrorT(nx, ny) {
    const len = Math.hypot(nx, ny);
    const ux = nx / len, uy = ny / len;
    const apply = q => mirrorN(q, ux, uy);
    const scad = `mirror([${r5(nx)}, ${r5(ny)}, 0])`;
    return T(apply, scad);
  }
  function translateT(dx, dy) {
    const apply = q => V(q.x + dx, q.y + dy);
    const scad = (dx === 0 && dy === 0) ? "" : `translate([${r5(dx)}, ${r5(dy)}])`;
    return T(apply, scad);
  }
  function composeT(t1, t2) {
    return T(
      q => t2.apply(t1.apply(q)),
      [t2.scad, t1.scad].filter(Boolean).join(" ")
    );
  }

  const GROUPS = {};

  // --- p1 -- o (translation only) ------------------------------------------
  (function () {
    const v1 = V(1, 0), v2 = V(0.2, 0.6); // oblique defaults from p1_Template.scad
    const instancesT = [idT()];
    GROUPS.p1 = {
      label: "p1 — o",
      file: "p1_Template.scad",
      domain: [V(0, 0), v1, V(v1.x + v2.x, v1.y + v2.y), v2],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [v1, v2]
    };
  })();

  // --- p2 -- 2222 -------------------------------------------------------
  (function () {
    const H = 0.25;
    const instancesT = [idT(), rotT(180)];
    GROUPS.p2 = {
      label: "p2 — 2222",
      file: "p2_Template.scad",
      domain: [V(-0.5, 0), V(0.5, 0), V(0, H)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(0.5, H), V(0.5, -H)]
    };
  })();

  // --- pm -- ** ----------------------------------------------------------
  (function () {
    const L = Math.PI, H = 3;
    const instancesT = [idT(), mirrorT(0, 1)];
    GROUPS.pm = {
      label: "pm — **",
      file: "pm_Template.scad",
      domain: [V(-L, 0), V(-L, H), V(L, H), V(L, 0)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(2 * L, 0), V(0, 2 * H)]
    };
  })();

  // --- pg -- ×× -----------------------------------------------------------
  (function () {
    const rectH = 0.5, rectL = 0.15;
    const instancesT = [idT(), composeT(mirrorT(0, 1), translateT(rectL, 0))];
    GROUPS.pg = {
      label: "pg — ××",
      file: "pg_Template.scad",
      domain: [V(0, rectH), V(rectL, rectH), V(rectL, -rectH), V(0, -rectH)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(2 * rectL, 0), V(0, 2 * rectH)]
    };
  })();

  // --- cm -- *× -----------------------------------------------------------
  (function () {
    const W = 0.4;
    const instancesT = [idT(), mirrorT(1, 0)];
    GROUPS.cm = {
      label: "cm — *×",
      file: "cm_Template.scad",
      domain: [V(W, 0), V(0, 0.5), V(0, -0.5)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(2 * W, 0), V(W, 0.5)]
    };
  })();

  // --- pmm -- *2222 --------------------------------------------------------
  (function () {
    const L = 10, H = 15;
    const instancesT = [idT(), mirrorT(1, 0), mirrorT(0, 1), rotT(180)];
    GROUPS.pmm = {
      label: "pmm — *2222",
      file: "pmm_Template.scad",
      domain: [V(0, 0), V(L, 0), V(L, H), V(0, H)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(2 * L, 0), V(0, 2 * H)]
    };
  })();

  // --- pmg -- 22* --------------------------------------------------------
  (function () {
    const L = 0.5, H = 0.5;
    const instancesT = [
      idT(),
      composeT(mirrorT(1, 0), composeT(mirrorT(0, 1), translateT(0, H))),
      composeT(mirrorT(1, 0), translateT(0, -H)),
      mirrorT(0, 1)
    ];
    GROUPS.pmg = {
      label: "pmg — 22*",
      file: "pmg_Template.scad",
      domain: [V(0, 0), V(0, H), V(L, H), V(L, 0)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(2 * L, 0), V(0, 2 * H)]
    };
  })();

  // --- pgg -- 22× --------------------------------------------------------
  (function () {
    const rectX = 1, rectY = 1;
    const instancesT = [
      idT(),
      rotT(180),
      composeT(mirrorT(1, 0), translateT(-rectX / 2, -rectY / 2)),
      composeT(mirrorT(0, 1), translateT(rectX / 2, rectY / 2))
    ];
    GROUPS.pgg = {
      label: "pgg — 22×",
      file: "pgg_Template.scad",
      domain: [V(-rectX / 2, 0), V(0, rectY / 2), V(rectX / 2, 0)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(rectX, 0), V(0, rectY)]
    };
  })();

  // --- cmm -- 2*22 -------------------------------------------------------
  (function () {
    const rectX = 0.6, rectY = Math.sin(Math.acos(0.6));
    const instancesT = [idT(), mirrorT(1, 0), rotT(180), mirrorT(0, 1)];
    GROUPS.cmm = {
      label: "cmm — 2*22",
      file: "cmm_Template.scad",
      domain: [V(0, 0), V(rectX, 0), V(0, rectY)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(2 * rectX, 0), V(rectX, rectY)]
    };
  })();

  // p3 and p3m1 both build their 6/12-fold rotation fan by rotating around
  // TWO different pivots (F and E), which -- unlike every other group here --
  // makes the copies genuinely overlap (coverage ratio 2, not 1). The real
  // templates fix this by intersecting the whole union with a larger
  // "abcd_boundary" quad before it's used as one tile; without that clip a
  // preview would double-draw overlapping regions. Reproduce that boundary
  // here so the preview clips exactly like the template does.
  const ABCD_BOUNDARY = [
    V(-0.25, SQRT3 / 4), V(0.75, SQRT3 / 4), V(0.25, -SQRT3 / 4), V(-0.75, -SQRT3 / 4)
  ];

  // --- p3 -- 333 -----------------------------------------------------------
  (function () {
    const A = V(-0.25, SQRT3 / 4), F = V(0.25, SQRT3 / 12),
          C = V(0.25, -SQRT3 / 4), E = V(-0.25, -SQRT3 / 12);
    const instancesT = [];
    for (const pivot of [F, E]) {
      for (const ang of [0, 120, 240]) {
        instancesT.push(rotT(ang, pivot));
      }
    }
    GROUPS.p3 = {
      label: "p3 — 333",
      file: "p3_Template.scad",
      domain: [A, F, C, E],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(1, 0), V(-0.5, SQRT3 / 2)],
      clipBoundary: ABCD_BOUNDARY
    };
  })();

  // --- p3m1 -- *333 --------------------------------------------------------
  (function () {
    const A = V(-0.25, SQRT3 / 4), F = V(0.25, SQRT3 / 12), E = V(-0.25, -SQRT3 / 12);
    const nx = -0.5, ny = SQRT3 / 2; // unit normal of mirror([-1/4, sqrt(3)/4, 0])
    const instancesT = [];

      for (const ang of [0, 120, 240]) {
        instancesT.push(rotT(ang, pivot));
        instancesT.push(composeT(mirrorT(nx, ny), rotT(ang, pivot)));
      }
    }
    GROUPS.p3m1 = {
      label: "p3m1 — *333",
      file: "p3m1_Template.scad",
      domain: [A, F, E],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(1, 0), V(-0.5, SQRT3 / 2)],
      clipBoundary: ABCD_BOUNDARY
    };
  })();

  // --- p31m -- 3*3 ---------------------------------------------------------
  (function () {
    const A = V(0.25, SQRT3 / 12), B = V(-0.25, SQRT3 / 4), C = V(0.75, SQRT3 / 4);
    const nx = SQRT3 / 2, ny = 0.5; // unit normal of mirror([sqrt(3)/2, 1/2, 0])
    const instancesT = [];
    for (const ang of [0, 120, 240]) instancesT.push(rotT(ang, A));
    for (const ang of [0, 120, 240]) instancesT.push(composeT(rotT(ang, A), mirrorT(nx, ny)));
    GROUPS.p31m = {
      label: "p31m — 3*3",
      file: "p31m_Template.scad",
      domain: [A, B, C],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(1, 0), V(0.5, SQRT3 / 2)]
    };
  })();

  // --- p4 -- 442 -----------------------------------------------------------
  (function () {
    const instancesT = [idT(), rotT(90), rotT(180), rotT(270)];
    GROUPS.p4 = {
      label: "p4 — 442",
      file: "p4_Template.scad",
      domain: [V(0, 0), V(0, 0.5), V(0.5, 0.5), V(0.5, 0)],

      instancesScad: instancesT.map(t => t.scad),

  // --- p4m -- *442 ---------------------------------------------------------
  (function () {
    const instancesT = [];
    for (const ang of [0, 90, 180, 270]) {
      instancesT.push(rotT(ang));
      instancesT.push(composeT(mirrorT(0, 1), rotT(ang)));
    }
    GROUPS.p4m = {
      label: "p4m — *442",
      file: "p4m_Template.scad",
      domain: [V(0, 0), V(0.5, 0), V(0.5, 0.5)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(1, 0), V(0, 1)]
    };
  })();

  // --- p4g -- 4*2 ----------------------------------------------------------
  (function () {
    const rectX = 0.5, rectY = 0.5;
    const instancesT = [];
    const g = composeT(mirrorT(1, 1), translateT(rectY, rectX));
    for (const ang of [0, 90, 180, 270]) {
      instancesT.push(rotT(ang));
      instancesT.push(composeT(g, rotT(ang)));
    }
    GROUPS.p4g = {
      label: "p4g — 4*2",
      file: "p4g_Template.scad",
      domain: [V(0, 0), V(rectX, 0), V(0, rectY)],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(1, 0), V(0, 1)]
    };
  })();

  // --- p6 -- 632 -----------------------------------------------------------
  (function () {
    const A = V(0.25, SQRT3 / 12), B = V(-0.25, SQRT3 / 4), C = V(0.75, SQRT3 / 4);
    const instancesT = [];
    for (const ang of [0, 120, 240]) instancesT.push(rotT(ang, A));
    for (const ang of [0, 120, 240]) instancesT.push(composeT(rotT(ang, A), rotT(180)));
    GROUPS.p6 = {
      label: "p6 — 632",
      file: "p6_Template.scad",
      domain: [A, B, C],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(1, 0), V(0, SQRT3 / 2)]
    };
  })();

  // --- p6m -- *632 ---------------------------------------------------------
  (function () {
    const A = V(0.25, SQRT3 / 12), B = V(0.25, SQRT3 / 4), C = V(0.75, SQRT3 / 4);
    const mirrorX = composeT(mirrorT(1, 0), translateT(0.5, 0)); // reflect_line(90, A)
    const base = [];
    for (const ang of [0, 120, 240]) base.push(rotT(ang, A));
    for (const ang of [0, 120, 240]) base.push(composeT(mirrorX, rotT(ang, A)));
    const instancesT = [];
    for (const t of base) instancesT.push(t);
    for (const t of base) instancesT.push(composeT(t, rotT(180)));
    GROUPS.p6m = {
      label: "p6m — *632",
      file: "p6m_Template.scad",
      domain: [A, B, C],
      instances: instancesT.map(t => t.apply),
      instancesScad: instancesT.map(t => t.scad),
      lattice: [V(1, 0), V(0, SQRT3 / 2)]
    };
  })();

  const GROUP_ORDER = ["p1","p2","pm","pg","cm","pmm","pmg","pgg","cmm",
                       "p3","p3m1","p31m","p4","p4m","p4g","p6","p6m"];

  for (const key of GROUP_ORDER) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = GROUPS[key].label;
    groupSelect.appendChild(opt);
  }

  let GROUP_KEY = "p2";
  let G = GROUPS[GROUP_KEY];
  let TRI = G.domain; // current domain polygon (name kept short; not always a triangle)

  // --- Coordinate system ----------------------------------------------------
  const SIZE = 640;
  const MARGIN = 60;
  const SPAN = SIZE - 2 * MARGIN;      // pixels available for the view window
  const ROUND = 5;                     // decimals in output

  let VIEW = null, VIEW_SPAN = 1;

  function computeView() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const v of TRI) {
      if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
      if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const half = Math.max(maxX - minX, maxY - minY) / 2 * 1.35 || 0.5;
    VIEW = { xmin: cx - half, xmax: cx + half, ymin: cy - half, ymax: cy + half };
    VIEW_SPAN = VIEW.xmax - VIEW.xmin;
  }

  function toScreen(x, y) {
    return {
      px: MARGIN + (x - VIEW.xmin) / VIEW_SPAN * SPAN,
      py: MARGIN + (VIEW.ymax - y) / VIEW_SPAN * SPAN   // invert y
    };
  }
  function toModel(px, py) {
    return {
      x: VIEW.xmin + (px - MARGIN) / SPAN * VIEW_SPAN,
      y: VIEW.ymax - (py - MARGIN) / SPAN * VIEW_SPAN
    };
  }

  // Points, handles, and circles are no longer clamped to the fundamental
  // domain: cuts are allowed to bleed past its edges on purpose, so adjacent
  // tile copies overlap slightly at the seam instead of leaving a sliver gap
  // when printed/cut. The domain outline is still drawn (and dimmed outside)
  // purely as a placement reference.

  // Snap radius in screen pixels; converted to model units for comparison.
  const SNAP_PX = 12;
  function snapModelRadius() { return SNAP_PX / SPAN * VIEW_SPAN; }

  // Collect snap targets: every domain corner + every placed point
  // (across all polygons). Optionally exclude one point (e.g. the one being
  // dragged) by reference.
  function snapTargets(exclude) {
    const targets = TRI.map(v => ({ x: v.x, y: v.y }));
    for (const poly of polygons) {
      for (const pt of poly.points) {
        if (pt === exclude) continue;
        targets.push({ x: pt.x, y: pt.y });
      }
    }
    for (const c of circles) {
      if (c === exclude) continue;
      targets.push({ x: c.cx, y: c.cy });
    }
    return targets;
  }

  // Alignment-guide targets: same source points as snapTargets (minus domain
  // corners aren't excluded either -- lining up with a corner is useful too),
  // but matched per-axis independently instead of by full (x,y) proximity.
  function alignTargets(exclude) {
    return snapTargets(exclude);
  }

  // If a point's x or y lines up (within snap radius) with an existing
  // point's x or y, snap that axis onto it. Returns which axes snapped so a
  // guide line can be drawn.
  function applyAlignSnap(p, exclude) {
    if (!alignToggle.checked) return { x: p.x, y: p.y, snapX: false, snapY: false };
    const r = snapModelRadius();
    let bestX = null, bestDX = r;
    let bestY = null, bestDY = r;
    for (const t of alignTargets(exclude)) {
      const dx = Math.abs(t.x - p.x);
      if (dx < bestDX) { bestDX = dx; bestX = t.x; }
      const dy = Math.abs(t.y - p.y);
      if (dy < bestDY) { bestDY = dy; bestY = t.y; }
    }
    return {
      x: bestX != null ? bestX : p.x,
      y: bestY != null ? bestY : p.y,
      snapX: bestX != null,
      snapY: bestY != null
    };
  }

  // Full point/corner snap takes priority (exact match on both axes); if it
  // doesn't hit, fall back to independent per-axis alignment snap and record
  // the guide line(s) to draw. `activeGuide` is a render-time side effect --
  // every interactive call to resolvePoint() refreshes it.
  let activeGuide = { x: null, y: null };
  function resolvePoint(raw, exclude) {
    const full = applySnap(raw, exclude);
    if (full.x !== raw.x || full.y !== raw.y) {
      activeGuide = { x: null, y: null };
      return { x: full.x, y: full.y };
    }
    const aligned = applyAlignSnap(raw, exclude);
    activeGuide = { x: aligned.snapX ? aligned.x : null, y: aligned.snapY ? aligned.y : null };
    return { x: aligned.x, y: aligned.y };
  }

  // If snapping is on and a target is within range, return it; else return p.
  function applySnap(p, exclude) {
    if (!snapToggle.checked) return p;
    const r = snapModelRadius();
    const r2 = r * r;
    let best = null, bestD = r2;
    for (const t of snapTargets(exclude)) {
      const d = (t.x - p.x) ** 2 + (t.y - p.y) ** 2;
      if (d <= bestD) { bestD = d; best = t; }
    }
    return best ? { x: best.x, y: best.y } : p;
  }

  // --- Hit testing (edit mode) ---------------------------------------------
  const HIT_PX = 10;   // pixel radius for grabbing a point or handle

  // Find the closest anchor or control handle (across all polygons) to the
  // given model-space point, within HIT_PX screen pixels.
  function hitTest(m) {
    const ms = toScreen(m.x, m.y);
    let best = null, bestD = HIT_PX * HIT_PX;
    for (const poly of polygons) {
      for (const pt of poly.points) {
        // anchor
        const as = toScreen(pt.x, pt.y);
        let d = (as.px - ms.px) ** 2 + (as.py - ms.py) ** 2;
        if (d <= bestD) { bestD = d; best = { poly, point: pt, kind: "anchor" }; }
        // control handle (if present)
        if (pt.cx != null) {
          const hs = toScreen(pt.cx, pt.cy);
          d = (hs.px - ms.px) ** 2 + (hs.py - ms.py) ** 2;
          if (d <= bestD) { bestD = d; best = { poly, point: pt, kind: "handle" }; }
        }
      }
    }
    for (const c of circles) {
      const cs = toScreen(c.cx, c.cy);
      let d = (cs.px - ms.px) ** 2 + (cs.py - ms.py) ** 2;
      if (d <= bestD) { bestD = d; best = { circle: c, kind: "circle-center" }; }
      const es = toScreen(c.cx + c.r, c.cy);
      d = (es.px - ms.px) ** 2 + (es.py - ms.py) ** 2;
      if (d <= bestD) { bestD = d; best = { circle: c, kind: "circle-edge" }; }
    }
    return best;
  }

  // --- State ---------------------------------------------------------------
  // Each polygon: { points: [{x,y, cx,cy}], closed: bool }
  //   cx,cy = bezier control handle for the segment ENTERING this point
  //           (relative to model space). null => straight segment.
  let polygons = [];
  let current = newPoly();
  polygons.push(current);

  // Circles: [{cx, cy, r}], drawn/edited independently of the polygon list.
  let circles = [];
  let circleDraft = null;   // circle currently being dragged out in circle mode
  let lastHover = null;     // last hitTest() result while hovering in edit mode (for Delete)

  // Bezier drag state
  let dragging = false;
  let dragPointIndex = -1;
  let mouse = null; // last known model-space mouse position

  function newPoly() { return { points: [], closed: false }; }

  // --- Inline point editor (edit mode) --------------------------------------
  // A click (mousedown+mouseup with negligible movement) on a point in edit
  // mode opens a small floating X/Y box next to it so its coordinates can be
  // typed exactly. Dragging still works as before -- dragMoved distinguishes
  // the two at mouseup. `pointEditorTarget` reuses hitTest()'s shape:
  // { poly, point, kind: "anchor"|"handle" } or { circle, kind: "circle-center"|"circle-edge" }.
  let pointEditorTarget = null;
  let mouseDownClient = null;
  let dragMoved = false;
  const CLICK_SLOP = 3; // px in client space; below this a mousedown/up pair counts as a click

  function targetModelPos(t) {
    if (!t) return null;
    if (t.kind === "anchor") return { x: t.point.x, y: t.point.y };
    if (t.kind === "handle") return { x: t.point.cx, y: t.point.cy };
    if (t.kind === "circle-center") return { x: t.circle.cx, y: t.circle.cy };
    if (t.kind === "circle-edge") return { x: t.circle.cx + t.circle.r, y: t.circle.cy };
    return null;
  }

  function closePointEditor() {
    pointEditorTarget = null;
    pointEditor.style.display = "none";
  }

  function positionPointEditor() {
    if (!pointEditorTarget) return;
    const p = targetModelPos(pointEditorTarget);
    if (!p) return;
    const s = toScreen(p.x, p.y);
    const canvasRect = canvas.getBoundingClientRect();
    const wrapRect = canvas.parentElement.getBoundingClientRect();
    const scaleX = canvasRect.width / canvas.width;
    const scaleY = canvasRect.height / canvas.height;
    const baseLeft = (canvasRect.left - wrapRect.left) + s.px * scaleX;
    const baseTop = (canvasRect.top - wrapRect.top) + s.py * scaleY;
    const editorW = pointEditor.offsetWidth || 160;
    const editorH = pointEditor.offsetHeight || 32;
    const putRight = s.px < SIZE * 0.65;
    pointEditor.style.left = (putRight ? baseLeft + 14 : baseLeft - editorW - 14) + "px";
    pointEditor.style.top = Math.max(4, baseTop - editorH / 2) + "px";
  }

  function refreshPointEditorFields() {
    if (!pointEditorTarget) return;
    const t = pointEditorTarget;
    if (t.kind === "circle-edge") {
      peX.value = fmt(t.circle.r);
    } else {
      const p = targetModelPos(t);
      peX.value = fmt(p.x);
      peY.value = fmt(p.y);
    }
  }

  function openPointEditor(target) {
    pointEditorTarget = target;
    const isRadius = target.kind === "circle-edge";
    peXLabel.textContent = isRadius ? "R" : "X";
    peYWrap.style.display = isRadius ? "none" : "flex";
    pointEditor.style.display = "flex";
    refreshPointEditorFields();
    positionPointEditor();
    peX.focus();
    peX.select();
  }

  function applyPointEditorInput() {
    const t = pointEditorTarget;
    if (!t) return;
    const xv = parseFloat(peX.value);
    if (t.kind === "circle-edge") {
      if (Number.isNaN(xv)) return;
      t.circle.r = Math.max(0.001, xv);
    } else {
      const yv = parseFloat(peY.value);
      if (Number.isNaN(xv) || Number.isNaN(yv)) return;
      if (t.kind === "anchor") { t.point.x = xv; t.point.y = yv; }
      else if (t.kind === "handle") { t.point.cx = xv; t.point.cy = yv; }
      else if (t.kind === "circle-center") { t.circle.cx = xv; t.circle.cy = yv; }
    }
    render();
  }

  peX.addEventListener("input", applyPointEditorInput);
  peY.addEventListener("input", applyPointEditorInput);
  [peX, peY].forEach(inp => {
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === "Escape") {
        e.preventDefault();
        closePointEditor();
      }
    });
  });

  // --- Drawing -------------------------------------------------------------
  function drawGrid() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // background grid, spaced to roughly 12 divisions across the view window
    ctx.lineWidth = 1;
    ctx.strokeStyle = getCSS("--grid");
    ctx.beginPath();
    const rawStep = VIEW_SPAN / 12;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const step = [1, 2, 5, 10].map(m => m * mag).reduce((best, s) =>
      Math.abs(s - rawStep) < Math.abs(best - rawStep) ? s : best, mag);
    const gstart = Math.ceil(VIEW.xmin / step) * step;
    for (let i = gstart; i <= VIEW.xmax + 1e-9; i += step) {
      const a = toScreen(i, VIEW.ymax), b = toScreen(i, VIEW.ymin);
      ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py);
    }
    const hstart = Math.ceil(VIEW.ymin / step) * step;
    for (let j = hstart; j <= VIEW.ymax + 1e-9; j += step) {
      const c = toScreen(VIEW.xmin, j), d = toScreen(VIEW.xmax, j);
      ctx.moveTo(c.px, c.py); ctx.lineTo(d.px, d.py);
    }
    ctx.stroke();

    // axes (x=0 / y=0) if within view
    ctx.strokeStyle = getCSS("--axis");
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (VIEW.xmin <= 0 && VIEW.xmax >= 0) {
      const t = toScreen(0, VIEW.ymax), bm = toScreen(0, VIEW.ymin);
      ctx.moveTo(t.px, t.py); ctx.lineTo(bm.px, bm.py);
    }
    if (VIEW.ymin <= 0 && VIEW.ymax >= 0) {
      const l = toScreen(VIEW.xmin, 0), r = toScreen(VIEW.xmax, 0);
      ctx.moveTo(l.px, l.py); ctx.lineTo(r.px, r.py);
    }
    ctx.stroke();

    // dim everything outside the fundamental domain so the drawable area is clear
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, SIZE, SIZE);
    TRI.forEach((v, i) => {
      const s = toScreen(v.x, v.y);
      if (i) ctx.lineTo(s.px, s.py); else ctx.moveTo(s.px, s.py);
    });
    ctx.closePath();
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill("evenodd");
    ctx.restore();

    // domain boundary
    ctx.strokeStyle = getCSS("--accent");
    ctx.lineWidth = 2;
    ctx.beginPath();
    TRI.forEach((v, i) => {
      const s = toScreen(v.x, v.y);
      if (i) ctx.lineTo(s.px, s.py); else ctx.moveTo(s.px, s.py);
    });
    ctx.closePath();
    ctx.stroke();

    // vertex labels (each domain corner, coordinates from the active group)
    ctx.fillStyle = getCSS("--text-dim");
    ctx.font = "12px monospace";
    const cx = (VIEW.xmin + VIEW.xmax) / 2, cy = (VIEW.ymin + VIEW.ymax) / 2;
    TRI.forEach(v => {
      const dx = v.x >= cx ? 8 : -8;
      const dy = v.y >= cy ? -8 : 16;
      label(`(${fmt(v.x)}, ${fmt(v.y)})`, v.x, v.y, dx, dy, dx > 0 ? "left" : "right");
    });
  }

  function label(text, x, y, dx, dy, align) {
    const p = toScreen(x, y);
    ctx.textAlign = align === "left" ? "left" : "right";
    ctx.fillText(text, p.px + dx, p.py + dy);
    ctx.textAlign = "left";
  }

  function getCSS(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  // Sample a quadratic bezier from p0 -> p1 with control c, t in [0,1]
  function quad(p0, c, p1, t) {
    const mt = 1 - t;
    return {
      x: mt * mt * p0.x + 2 * mt * t * c.x + t * t * p1.x,
      y: mt * mt * p0.y + 2 * mt * t * c.y + t * t * p1.y
    };
  }

  function drawPolyPath(poly, isCurrent) {
    const pts = poly.points;
    if (pts.length === 0) return;

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = poly.closed ? getCSS("--closed") : getCSS("--line");

    // build the visible path (with bezier interpolation)
    ctx.beginPath();
    const start = toScreen(pts[0].x, pts[0].y);
    ctx.moveTo(start.px, start.py);

    const segCount = parseInt(segInput.value) || 12;

    for (let i = 1; i < pts.length; i++) {
      strokeSegment(pts[i - 1], pts[i], segCount);
    }
    if (poly.closed && pts.length > 2) {
      strokeSegment(pts[pts.length - 1], pts[0], segCount, true);
    }
    ctx.stroke();

    // fill closed shape faintly
    if (poly.closed && pts.length > 2) {
      ctx.fillStyle = "rgba(102,187,106,0.10)";
      ctx.fill();
    }

    // control handles: shown while drawing the current open poly, OR for
    // every poly when in edit mode (so they can be grabbed).
    if ((isCurrent && !poly.closed) || mode === "edit") {
      for (let i = 1; i < pts.length; i++) {
        if (pts[i].cx != null) drawHandle(pts[i - 1], pts[i]);
      }
    }

    // points
    for (let i = 0; i < pts.length; i++) {
      const p = toScreen(pts[i].x, pts[i].y);
      ctx.beginPath();
      ctx.arc(p.px, p.py, i === 0 ? 6 : 5, 0, Math.PI * 2);
      ctx.fillStyle = i === 0 ? getCSS("--accent") : getCSS("--point");
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#1a1d23";
      ctx.stroke();
    }
  }

  function strokeSegment(a, b, segCount, closing) {
    if (b.cx != null) {
      const c = { x: b.cx, y: b.cy };
      for (let s = 1; s <= segCount; s++) {
        const pt = quad(a, c, b, s / segCount);
        const sp = toScreen(pt.x, pt.y);
        ctx.lineTo(sp.px, sp.py);
      }
    } else {
      const sp = toScreen(b.x, b.y);
      ctx.lineTo(sp.px, sp.py);
    }
  }

  function drawHandle(a, b) {
    const c = toScreen(b.cx, b.cy);
    const sa = toScreen(a.x, a.y);
    const sb = toScreen(b.x, b.y);
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = getCSS("--bezier");
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sa.px, sa.py); ctx.lineTo(c.px, c.py);
    ctx.lineTo(sb.px, sb.py);
    ctx.stroke();
    ctx.restore();
    ctx.beginPath();
    ctx.arc(c.px, c.py, 4, 0, Math.PI * 2);
    ctx.fillStyle = getCSS("--bezier");
    ctx.fill();
  }

  function drawSnapIndicator() {
    if (mode === "edit") return;
    if (mode === "circle" && circleDraft) return;
    if (!mouse || !snapToggle.checked) return;
    const target = applySnap(mouse);
    // Only show if an actual snap target (not the raw cursor) was found.
    if (target.x === mouse.x && target.y === mouse.y) return;
    const s = toScreen(target.x, target.y);
    ctx.save();
    ctx.strokeStyle = getCSS("--closed");
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(s.px, s.py, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawPreview() {
    if (mode !== "draw") { activeGuide = { x: null, y: null }; return; }
    if (!mouse || current.closed) { activeGuide = { x: null, y: null }; return; }
    const pts = current.points;
    if (pts.length === 0) { activeGuide = { x: null, y: null }; return; }
    const last = pts[pts.length - 1];
    const a = toScreen(last.x, last.y);
    // Preview line follows the snapped position so the student sees where
    // the point will actually land.
    const target = resolvePoint(mouse);
    const m = toScreen(target.x, target.y);
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(a.px, a.py);
    ctx.lineTo(m.px, m.py);
    ctx.stroke();
    ctx.restore();
  }

  function drawCircles() {
    for (const c of circles) {
      const s = toScreen(c.cx, c.cy);
      const rs = c.r / VIEW_SPAN * SPAN;
      ctx.beginPath();
      ctx.arc(s.px, s.py, rs, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(79,195,247,0.15)";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = getCSS("--line");
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(s.px, s.py, 4, 0, Math.PI * 2);
      ctx.fillStyle = getCSS("--point");
      ctx.fill();
      if (mode === "edit") {
        const es = toScreen(c.cx + c.r, c.cy);
        ctx.beginPath();
        ctx.arc(es.px, es.py, 4, 0, Math.PI * 2);
        ctx.fillStyle = getCSS("--bezier");
        ctx.fill();
      }
    }
  }

  // Dashed lines showing the horizontal/vertical line the current point just
  // aligned onto (see resolvePoint()).
  function drawAlignGuides() {
    if (activeGuide.x == null && activeGuide.y == null) return;
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = getCSS("--bezier");
    ctx.lineWidth = 1;
    if (activeGuide.x != null) {
      const a = toScreen(activeGuide.x, VIEW.ymin), b = toScreen(activeGuide.x, VIEW.ymax);
      ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
    }
    if (activeGuide.y != null) {
      const a = toScreen(VIEW.xmin, activeGuide.y), b = toScreen(VIEW.xmax, activeGuide.y);
      ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
    }
    ctx.restore();
  }

  function render() {
    drawGrid();
    for (const poly of polygons) {
      drawPolyPath(poly, poly === current);
    }
    drawCircles();
    drawPreview();
    drawSnapIndicator();
    drawAlignGuides();
    positionPointEditor();
    updateOutput();
  }

  // --- Output generation ---------------------------------------------------
  function fmt(v) {
    return (+v.toFixed(ROUND)).toString();
  }

  function expandPoly(poly) {
    // returns array of {x,y} model points, bezier curves flattened
    const pts = poly.points;
    const out = [];
    const segCount = parseInt(segInput.value) || 12;
    if (pts.length === 0) return out;
    out.push({ x: pts[0].x, y: pts[0].y });
    for (let i = 1; i < pts.length; i++) {
      pushSeg(out, pts[i - 1], pts[i], segCount);
    }
    return out;
  }

  function pushSeg(out, a, b, segCount) {
    if (b.cx != null) {
      const c = { x: b.cx, y: b.cy };
      for (let s = 1; s <= segCount; s++) {
        out.push(quad(a, c, b, s / segCount));
      }
    } else {
      out.push({ x: b.x, y: b.y });
    }
  }

  // --- Tiling preview --------------------------------------------------------
  // Generic version of the p2-only preview: apply every symmetry instance of
  // the active group to build one tile's worth of domain copies, then
  // translate that tile over the group's lattice vectors.
  const TILE_RANGE = 2;                        // tiles drawn: -2..2 in each dir

  // Returns one entry per lattice cell: { translate:{x,y}, placements:[fn,...] }
  // Each placement fn maps a domain-frame point to its final plane position.
  // A separate per-cell grouping (rather than one flat list) is what lets
  // groups with a clipBoundary (p3, p3m1) clip once per cell around all of
  // that cell's overlapping instances, matching how the real templates
  // intersect the whole rotated union with abcd_boundary.
  function allCells() {
    const cells = [];
    const [lat1, lat2] = G.lattice;
    for (let a = -TILE_RANGE; a <= TILE_RANGE; a++) {
      for (let b = -TILE_RANGE; b <= TILE_RANGE; b++) {
        const tx = a * lat1.x + b * lat2.x;
        const ty = a * lat1.y + b * lat2.y;
        const placements = G.instances.map(inst => (q => {
          const p = inst(q);
          return { x: p.x + tx, y: p.y + ty };
        }));
        cells.push({ translate: { x: tx, y: ty }, placements });
      }
    }
    return cells;
  }

  function allPlacements() {
    const out = [];
    for (const cell of allCells()) out.push(...cell.placements);
    return out;
  }

  function renderPreview() {
    if (!previewOpen) return;
    const W = previewCanvas.width, H = previewCanvas.height;
    pctx.clearRect(0, 0, W, H);

    const cells = allCells();
    const placements = allPlacements();

    // Fit all placed domains into the preview, preserving aspect ratio.
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const T of placements) {
      for (const v of TRI) {
        const p = T(v);
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      }
    }
    const pad = 10;
    const spanX = maxX - minX || 1, spanY = maxY - minY || 1;
    const scale = (Math.min(W, H) - 2 * pad) / Math.max(spanX, spanY);
    const offX = (W - spanX * scale) / 2;
    const offY = (H - spanY * scale) / 2;
    const P = q => ({
      px: offX + (q.x - minX) * scale,
      py: H - (offY + (q.y - minY) * scale)   // invert y
    });

    // Holes = the drawn polygons (>= 3 points), bezier-flattened.
    const holes = polygons
      .filter(p => p.points.length >= 3)
      .map(p => expandPoly(p));

    const fill = getCSS("--closed");

    function clipPath(pts) {
      pctx.beginPath();
      pts.forEach((v, i) => {
        const s = P(v);
        if (i) pctx.lineTo(s.px, s.py); else pctx.moveTo(s.px, s.py);
      });
      pctx.closePath();
      pctx.clip();
    }

    for (const cell of cells) {
      pctx.save();
      // For groups whose instances overlap by construction (p3, p3m1), clip
      // the whole cell to the translated abcd_boundary first, exactly like
      // the template's outer intersection() does.
      if (G.clipBoundary) {
        const boundaryPts = G.clipBoundary.map(v => ({
          x: v.x + cell.translate.x, y: v.y + cell.translate.y
        }));
        clipPath(boundaryPts);
      }
      for (const T of cell.placements) {
        pctx.save();
        // clip to this domain copy so holes/fill stay inside it
        clipPath(TRI.map(T));
        // fill the domain
        pctx.fillStyle = fill;
        pctx.fillRect(0, 0, W, H);
        // punch out the holes
        pctx.globalCompositeOperation = "destination-out";
        for (const hole of holes) {
          pctx.beginPath();
          hole.forEach((pt, i) => {
            const s = P(T(pt));
            if (i) pctx.lineTo(s.px, s.py); else pctx.moveTo(s.px, s.py);
          });
          pctx.closePath();
          pctx.fill();
        }
        const CIRCLE_SEG = 48;
        for (const c of circles) {
          pctx.beginPath();
          for (let k = 0; k <= CIRCLE_SEG; k++) {
            const ang = (k / CIRCLE_SEG) * Math.PI * 2;
            const pt = { x: c.cx + c.r * Math.cos(ang), y: c.cy + c.r * Math.sin(ang) };
            const s = P(T(pt));
            if (k) pctx.lineTo(s.px, s.py); else pctx.moveTo(s.px, s.py);
          }
          pctx.closePath();
          pctx.fill();
        }
        pctx.restore();
      }
      pctx.restore();
    }

    // faint outlines so the tile structure reads
    pctx.strokeStyle = "rgba(255,255,255,0.18)";
    pctx.lineWidth = 0.5;
    for (const T of placements) {
      pctx.beginPath();
      TRI.forEach((v, i) => {
        const s = P(T(v));
        if (i) pctx.lineTo(s.px, s.py); else pctx.moveTo(s.px, s.py);
      });
      pctx.closePath();
      pctx.stroke();
    }
  }

  function polyBlock(expanded) {
    const coords = expanded
      .map(p => `[${fmt(p.x)}, ${fmt(p.y)}]`)
      .join(",\n        ");
    return `polygon(points = [
        ${coords}
]);`;
  }

  function circleBlock(c) {
    return `translate([${fmt(c.cx)}, ${fmt(c.cy)}]) circle(r = ${fmt(c.r)}, $fn = 64);`;
  }

  // The shapes cut out of the fundamental domain -- shared by both output
  // modes (pasted raw for "Cut shapes", embedded in FundamentalCut() for
  // "Full panel").
  function shapeBlocks() {
    const blocks = [];
    for (const poly of polygons) {
      if (poly.points.length < 2) continue;
      blocks.push(polyBlock(expandPoly(poly)));
    }
    for (const c of circles) {
      blocks.push(circleBlock(c));
    }
    return blocks;
  }

  function indent(text, spaces) {
    const pad = " ".repeat(spaces);
    return text.split("\n").join("\n" + pad);
  }

  // A complete, ready-to-render .scad file: the fundamental domain, the
  // user's cut, this group's symmetry instances (from instancesScad, built
  // alongside the preview transforms in GROUPS -- see composeT() above),
  // tiled across the lattice, and framed in the standard golden-triangle
  // border (see Templates/GoldenTriangle_Blank_Template.scad). The frame
  // formula is always the nested difference() -- FundamentalCut always cuts
  // holes out of the domain, so CompiledTile is always a "background minus
  // cutouts" tile, never scattered positive shapes.
  function generateFullPanel() {
    const cuts = shapeBlocks();
    const cutBody = cuts.length ? indent(cuts.join("\n"), 4) : "// no shapes drawn yet";
    const domainPts = TRI.map(v => `[${fmt(v.x)}, ${fmt(v.y)}]`).join(", ");
    const [lat1, lat2] = G.lattice;
    const scaleVal = parseFloat(scaleInput.value) || 30;
    const tileLines = G.instancesScad.map(s =>
      `        weld() ${s ? s + " " : ""}FundamentalRemains();`
    ).join("\n");

    return `// Auto-generated by OpenSCAD Wallpaper Pattern Editor
// Wallpaper group: ${G.label}  (reference: ${G.file})

$fn = 48;
epsilon = 0.0001;

module weld() { offset(delta = epsilon) children(); }

module FundamentalDomain()
{
    polygon(points = [${domainPts}]);
}

module FundamentalCut()
{
    ${cutBody}
}

module FundamentalRemains()
{
    difference() { FundamentalDomain(); FundamentalCut(); }
}

module CompiledTile()
{
    union()
    {
${tileLines}
    }
}

module PatternArray()
{
    for (i = [-10:1:10])
        for (j = [-10:1:10])
            translate([i*${fmt(lat1.x)} + j*${fmt(lat2.x)}, i*${fmt(lat1.y)} + j*${fmt(lat2.y)}, 0])
                CompiledTile();
}

//----------------------------

base = 150;
phi = (1 + sqrt(5)) / 2;
holeGap = 8;

leftBase = [-base/2, 0];
rightBase = [base/2, 0];
side = phi * base;
height = sqrt(side*side - (base/2)*(base/2));
apex = [0, height];

module GoldenTriangle()
{
    polygon(points = [leftBase, rightBase, apex]);
}

difference()
{
    GoldenTriangle();
    difference()
    {
        offset(delta = -12) GoldenTriangle();
        render() translate([0, 100, 0]) scale(${fmt(scaleVal)}) PatternArray();
    }
    translate([(-base/2)+holeGap*cos(36), holeGap*sin(36)]) circle(r = 2, $fn = 100);
    translate([(base/2)-holeGap*cos(36), holeGap*sin(36)]) circle(r = 2, $fn = 100);
    translate([0, height - holeGap * 2]) circle(r = 2, $fn = 100);
    polygon(points = [[-10, 7], [10, 7], [10, 11], [-10, 11]]);
}
`;
  }

  function updateOutput() {
    output.value = outputMode === "full" ? generateFullPanel() : shapeBlocks().join("\n\n");
    renderPreview();
  }


  // --- Interaction ---------------------------------------------------------
  function getModelFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (e.clientX - rect.left) * scaleX;
    const py = (e.clientY - rect.top) * scaleY;
    return toModel(px, py);
  }

  function startNewIfClosed() {
    if (current.closed) {
      current = newPoly();
      polygons.push(current);
    }
  }

  canvas.addEventListener("mousedown", (e) => {
    const m = getModelFromEvent(e);

    if (mode === "edit") {
      const hit = hitTest(m);
      mouseDownClient = { x: e.clientX, y: e.clientY };
      dragMoved = false;
      if (hit) {
        editTarget = hit;
        canvas.style.cursor = "grabbing";
      } else {
        closePointEditor();
      }
      return;   // never add points in edit mode
    }

    if (mode === "circle") {
      const c = resolvePoint(m);
      circleDraft = { cx: c.x, cy: c.y, r: 0 };
      circles.push(circleDraft);
      setStatus();
      render();
      return;
    }

    // --- draw mode ---
    startNewIfClosed();

    const pts = current.points;
    const useBezier = bezierToggle.checked && pts.length >= 1;

    const cl = resolvePoint(m);
    const np = { x: cl.x, y: cl.y, cx: null, cy: null };

    if (useBezier) {
      // straight-line default control = midpoint; user drags to curve
      const prev = pts[pts.length - 1];
      np.cx = (prev.x + np.x) / 2;
      np.cy = (prev.y + np.y) / 2;
      pts.push(np);
      dragging = true;
      dragPointIndex = pts.length - 1;
    } else {
      pts.push(np);
    }
    setStatus();
    render();
  });

  canvas.addEventListener("mousemove", (e) => {
    const m = getModelFromEvent(e);
    mouse = m;
    readout.textContent = `( ${m.x.toFixed(3)}, ${m.y.toFixed(3)} )`;

    if (mode === "edit") {
      if (editTarget) {
        if (mouseDownClient) {
          const dcx = e.clientX - mouseDownClient.x, dcy = e.clientY - mouseDownClient.y;
          if (dcx * dcx + dcy * dcy > CLICK_SLOP * CLICK_SLOP) dragMoved = true;
        }
        // Move the grabbed anchor, handle, or circle. None of these are
        // clamped to the domain any more -- cuts are allowed to bleed past
        // its edges so tiled copies overlap at the seam instead of leaving
        // a sliver gap when printed/cut.
        if (editTarget.kind === "anchor") {
          // anchors still snap to corners/points (excluding themselves)
          const cl = resolvePoint(m, editTarget.point);
          editTarget.point.x = cl.x;
          editTarget.point.y = cl.y;
        } else if (editTarget.kind === "handle") {
          // control handle: no snapping
          editTarget.point.cx = m.x;
          editTarget.point.cy = m.y;
        } else if (editTarget.kind === "circle-center") {
          const cl = resolvePoint(m, editTarget.circle);
          editTarget.circle.cx = cl.x;
          editTarget.circle.cy = cl.y;
        } else if (editTarget.kind === "circle-edge") {
          activeGuide = { x: null, y: null };
          editTarget.circle.r = Math.max(0.001,
            Math.hypot(m.x - editTarget.circle.cx, m.y - editTarget.circle.cy));
        }
        canvas.style.cursor = "grabbing";
      } else {
        // hover feedback: show grab cursor when over a draggable target
        activeGuide = { x: null, y: null };
        const hover = hitTest(m);
        lastHover = hover;
        canvas.style.cursor = hover ? "grab" : "default";
      }
      render();
      return;
    }

    if (mode === "circle") {
      activeGuide = { x: null, y: null };
      if (circleDraft) {
        circleDraft.r = Math.max(0.001, Math.hypot(m.x - circleDraft.cx, m.y - circleDraft.cy));
      }
      render();
      return;
    }

    // --- draw mode ---
    if (dragging && dragPointIndex >= 0) {
      const p = current.points[dragPointIndex];
      p.cx = m.x;
      p.cy = m.y;
    }
    render();
  });

  window.addEventListener("mouseup", () => {
    if (mode === "edit") {
      if (editTarget) {
        if (!dragMoved) {
          openPointEditor(editTarget);
        } else {
          closePointEditor();
        }
        editTarget = null;
        activeGuide = { x: null, y: null };
        canvas.style.cursor = mouse && hitTest(mouse) ? "grab" : "default";
        setStatus();
        render();
      }
      mouseDownClient = null;
      return;
    }

    if (mode === "circle") {
      if (circleDraft) {
        if (circleDraft.r < 0.01) circles.pop();
        circleDraft = null;
        setStatus();
        render();
      }
      return;
    }

    if (dragging) {
      // if the handle is basically on the chord midpoint, treat as straight
      const p = current.points[dragPointIndex];
      const prev = current.points[dragPointIndex - 1];
      if (prev) {
        const midx = (prev.x + p.x) / 2, midy = (prev.y + p.y) / 2;
        if (Math.hypot(p.cx - midx, p.cy - midy) < 0.02) {
          p.cx = null; p.cy = null;
        }
      }
    }
    dragging = false;
    dragPointIndex = -1;
    render();
  });

  canvas.addEventListener("mouseleave", () => {
    mouse = null;
    activeGuide = { x: null, y: null };
    readout.textContent = "( –, – )";
    render();
  });

  // Delete/Backspace in edit mode removes the circle under the cursor
  // (or the one currently grabbed). Ignored while typing in the output box.
  window.addEventListener("keydown", (e) => {
    if (document.activeElement === output || document.activeElement === peX || document.activeElement === peY || document.activeElement === pointsInput) return;
    if (mode !== "edit") return;
    if (e.key !== "Delete" && e.key !== "Backspace") return;
    const target = editTarget || lastHover;
    if (!target || !target.circle) return;
    circles = circles.filter(c => c !== target.circle);
    if (pointEditorTarget && pointEditorTarget.circle === target.circle) closePointEditor();
    editTarget = null;
    lastHover = null;
    setStatus();
    render();
  });

  // --- Buttons -------------------------------------------------------------
  document.getElementById("undoBtn").addEventListener("click", () => {
    closePointEditor();
    if (current.points.length > 0) {
      current.closed = false;
      current.points.pop();
    } else if (polygons.length > 1) {
      polygons.pop();
      current = polygons[polygons.length - 1];
      current.closed = false;
    } else if (circles.length > 0) {
      circles.pop();
    }
    setStatus();
    render();
  });

  document.getElementById("closeBtn").addEventListener("click", () => {
    if (current.points.length >= 3) {
      current.closed = true;
      setStatus("Loop closed. Next click starts a new polygon.");
    } else {
      setStatus("Need at least 3 points to close a loop.");
    }
    render();
  });

  document.getElementById("newBtn").addEventListener("click", () => {
    if (current.points.length > 0) {
      current = newPoly();
      polygons.push(current);
      setStatus("Started a new polygon.");
      render();
    }
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    closePointEditor();
    polygons = [];
    circles = [];
    current = newPoly();
    polygons.push(current);
    setStatus("Cleared. Click to start drawing.");
    render();
  });

  // --- Draw polygon from typed points ------------------------------------
  // Accepts anything with numbers in reading order: "[0,0], [1,0], [0.5,1]",
  // OpenSCAD polygon() point lists, or one "x y" / "x, y" pair per line.
  function parsePointsInput(text) {
    const nums = (text.match(/-?\d*\.?\d+(?:[eE][-+]?\d+)?/g) || []).map(Number);
    const pts = [];
    for (let i = 0; i + 1 < nums.length; i += 2) {
      pts.push({ x: nums[i], y: nums[i + 1], cx: null, cy: null });
    }
    return pts;
  }

  drawPointsBtn.addEventListener("click", () => {
    const pts = parsePointsInput(pointsInput.value);
    if (pts.length < 2) {
      setStatus("Enter at least 2 points, e.g. <b>[0, 0], [1, 0], [0.5, 1]</b>.");
      return;
    }
    closePointEditor();
    const poly = { points: pts, closed: pts.length >= 3 };
    polygons.push(poly);
    current = newPoly();
    polygons.push(current);
    setStatus(`Drew polygon with <b>${pts.length}</b> point${pts.length === 1 ? "" : "s"} from input.`);
    render();
  });

  pointsInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      drawPointsBtn.click();
    }
  });

  const copyBtn = document.getElementById("copyBtn");
  copyBtn.addEventListener("click", () => {
    output.select();
    navigator.clipboard.writeText(output.value).then(() => {
      copyBtn.textContent = "Copied ✓";
      copyBtn.classList.add("copied");
      setTimeout(() => {
        copyBtn.textContent = "Copy";
        copyBtn.classList.remove("copied");
      }, 1400);
    }).catch(() => {
      document.execCommand("copy");
    });
  });

  downloadBtn.addEventListener("click", () => {
    const blob = new Blob([output.value], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${GROUP_KEY}_${outputMode === "full" ? "panel" : "cut"}.scad`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  outCutBtn.addEventListener("click", () => {
    outputMode = "cut";
    outCutBtn.classList.add("active");
    outFullBtn.classList.remove("active");
    updateOutput();
  });
  outFullBtn.addEventListener("click", () => {
    outputMode = "full";
    outFullBtn.classList.add("active");
    outCutBtn.classList.remove("active");
    updateOutput();
  });

  function setMode(next) {
    mode = next;
    drawModeBtn.classList.toggle("active", mode === "draw");
    circleModeBtn.classList.toggle("active", mode === "circle");
    editModeBtn.classList.toggle("active", mode === "edit");
    editTarget = null;
    circleDraft = null;
    closePointEditor();
    activeGuide = { x: null, y: null };
    canvas.style.cursor = mode === "edit" ? "default" : "crosshair";
    setStatus(
      mode === "edit"
        ? "Edit mode: drag any point, Bézier handle, or circle. Hover a circle and press Delete to remove it."
        : mode === "circle"
        ? "Circle mode: click and drag from the center out to the edge."
        : "Draw mode: click to place points."
    );
    render();
  }
  drawModeBtn.addEventListener("click", () => setMode("draw"));
  circleModeBtn.addEventListener("click", () => setMode("circle"));
  editModeBtn.addEventListener("click", () => setMode("edit"));

  previewToggle.addEventListener("click", () => {
    previewOpen = !previewOpen;
    previewPanel.classList.toggle("collapsed", !previewOpen);
    previewToggle.textContent = previewOpen ? "–" : "+";
    if (previewOpen) renderPreview();
  });

  segInput.addEventListener("change", render);
  scaleInput.addEventListener("change", render);
  bezierToggle.addEventListener("change", () => {
    setStatus(bezierToggle.checked
      ? "Bézier on: click then drag to curve the segment."
      : "Straight-line mode.");
  });
  snapToggle.addEventListener("change", () => {
    setStatus(snapToggle.checked
      ? "Snapping on: points lock to corners and existing points."
      : "Snapping off.");
    render();
  });
  alignToggle.addEventListener("change", () => {
    setStatus(alignToggle.checked
      ? "Alignment guides on: points snap onto other points' horizontal/vertical lines."
      : "Alignment guides off.");
    render();
  });

  groupSelect.addEventListener("change", () => {
    loadGroup(groupSelect.value);
  });

  function loadGroup(key) {
    GROUP_KEY = key;
    G = GROUPS[key];
    TRI = G.domain;
    computeView();
    polygons = [];
    circles = [];
    circleDraft = null;
    current = newPoly();
    polygons.push(current);
    mode = "draw";
    setMode("draw");
    previewFoot.textContent = `${G.label}  ·  ${G.file}`;
    setStatus(`Switched to ${G.label}. Canvas cleared -- click inside the domain to start drawing.`);
    render();
  }

  function setStatus(msg) {
    if (msg) { status.innerHTML = msg; return; }
    const n = current.points.length;
    const polyCount = polygons.filter(p => p.points.length >= 2).length;
    status.innerHTML =
      `Current polygon: <b>${n}</b> point${n === 1 ? "" : "s"} · ` +
      `Polygons: <b>${polyCount}</b> · Circles: <b>${circles.length}</b>`;
  }

  // init
  groupSelect.value = GROUP_KEY;
  loadGroup(GROUP_KEY);
})();
</script>
</body>
</html>
